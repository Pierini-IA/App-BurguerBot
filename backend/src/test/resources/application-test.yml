spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

  security:
    jwt:
      secret: test-secret-key-for-testing-purposes-only-do-not-use-in-production
      expiration: 3600000 # 1 hora

app:
  bot:
    api-key: test-bot-api-key

logging:
  level:
    root: WARN
    com.dioburger: INFO
    org.springframework: WARN
    org.hibernate: WARN
