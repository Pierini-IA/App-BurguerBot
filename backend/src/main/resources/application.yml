spring:
  application:
    name: dio-burger-api

  datasource:
    # DATABASE_URL manda si esta seteada (docker-compose local). Si no, la URL se
    # arma con las partes que Render inyecta desde la base (fromDatabase).
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dioburger}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000} # 24 horas

app:
  bot:
    api-key: ${BOT_API_KEY}
  meta:
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
    dry-run-send: ${DRY_RUN_META_SEND:false}
    graph-api-version: ${META_GRAPH_API_VERSION:v20.0}
  memoria:
    # Cuantos turnos de texto recuerda el bot y desde hace cuanto. Cada mensaje
    # viejo que se manda al modelo cuesta tokens y suma tiempo de respuesta.
    max-mensajes: ${MEMORIA_MAX_MENSAJES:10}
    minutos-vigencia: ${MEMORIA_MINUTOS_VIGENCIA:120}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  gemini:
    api-key: ${GOOGLE_AI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Configuración de logging con formato mejorado
logging:
  level:
    root: INFO
    com.dioburger: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n%wEx"
