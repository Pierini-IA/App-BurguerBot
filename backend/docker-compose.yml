version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: dioburger-postgres
    environment:
      POSTGRES_DB: dioburger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dioburger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local

networks:
  dioburger-network:
    driver: bridge
